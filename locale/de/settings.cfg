[mod-name]
configurable-scrap-recycling=Konfigurierbares Schrott-Recycling

[mod-description]
configurable-scrap-recycling=Stelle die Drop-Chance jedes möglichen Ergebnisses des Schrott-Recycling-Rezepts einzeln ein. Die Chancen gelten unabhängig pro Ergebnis, in Prozent (0-100). Standardwerte entsprechen Vanilla. Erfordert einen Neustart des Spiels.

[mod-setting-name]
csr-chance-iron-gear-wheel=[item=iron-gear-wheel] __ITEM__iron-gear-wheel__ Chance (%)
csr-chance-solid-fuel=[item=solid-fuel] __ITEM__solid-fuel__ Chance (%)
csr-chance-concrete=[item=concrete] __ITEM__concrete__ Chance (%)
csr-chance-ice=[item=ice] __ITEM__ice__ Chance (%)
csr-chance-steel-plate=[item=steel-plate] __ITEM__steel-plate__ Chance (%)
csr-chance-battery=[item=battery] __ITEM__battery__ Chance (%)
csr-chance-stone=[item=stone] __ITEM__stone__ Chance (%)
csr-chance-advanced-circuit=[item=advanced-circuit] __ITEM__advanced-circuit__ Chance (%)
csr-chance-copper-cable=[item=copper-cable] __ITEM__copper-cable__ Chance (%)
csr-chance-processing-unit=[item=processing-unit] __ITEM__processing-unit__ Chance (%)
csr-chance-low-density-structure=[item=low-density-structure] __ITEM__low-density-structure__ Chance (%)
csr-chance-holmium-ore=[item=holmium-ore] __ITEM__holmium-ore__ Chance (%)

[mod-setting-description]
csr-chance-iron-gear-wheel=Chance in Prozent, dass beim Recyceln von einem Schrott __ITEM__iron-gear-wheel__ herauskommt. Vanilla: 20%. 0 deaktiviert dieses Ergebnis. Jedes Ergebnis wird unabhängig gewürfelt.
csr-chance-solid-fuel=Chance in Prozent, dass beim Recyceln von einem Schrott __ITEM__solid-fuel__ herauskommt. Vanilla: 7%. 0 deaktiviert dieses Ergebnis. Jedes Ergebnis wird unabhängig gewürfelt.
csr-chance-concrete=Chance in Prozent, dass beim Recyceln von einem Schrott __ITEM__concrete__ herauskommt. Vanilla: 6%. 0 deaktiviert dieses Ergebnis. Jedes Ergebnis wird unabhängig gewürfelt.
csr-chance-ice=Chance in Prozent, dass beim Recyceln von einem Schrott __ITEM__ice__ herauskommt. Vanilla: 5%. 0 deaktiviert dieses Ergebnis. Jedes Ergebnis wird unabhängig gewürfelt.
csr-chance-steel-plate=Chance in Prozent, dass beim Recyceln von einem Schrott __ITEM__steel-plate__ herauskommt. Vanilla: 4%. 0 deaktiviert dieses Ergebnis. Jedes Ergebnis wird unabhängig gewürfelt.
csr-chance-battery=Chance in Prozent, dass beim Recyceln von einem Schrott __ITEM__battery__ herauskommt. Vanilla: 4%. 0 deaktiviert dieses Ergebnis. Jedes Ergebnis wird unabhängig gewürfelt.
csr-chance-stone=Chance in Prozent, dass beim Recyceln von einem Schrott __ITEM__stone__ herauskommt. Vanilla: 4%. 0 deaktiviert dieses Ergebnis. Jedes Ergebnis wird unabhängig gewürfelt.
csr-chance-advanced-circuit=Chance in Prozent, dass beim Recyceln von einem Schrott __ITEM__advanced-circuit__ herauskommt. Vanilla: 3%. 0 deaktiviert dieses Ergebnis. Jedes Ergebnis wird unabhängig gewürfelt.
csr-chance-copper-cable=Chance in Prozent, dass beim Recyceln von einem Schrott __ITEM__copper-cable__ herauskommt. Vanilla: 3%. 0 deaktiviert dieses Ergebnis. Jedes Ergebnis wird unabhängig gewürfelt.
csr-chance-processing-unit=Chance in Prozent, dass beim Recyceln von einem Schrott __ITEM__processing-unit__ herauskommt. Vanilla: 2%. 0 deaktiviert dieses Ergebnis. Jedes Ergebnis wird unabhängig gewürfelt.
csr-chance-low-density-structure=Chance in Prozent, dass beim Recyceln von einem Schrott __ITEM__low-density-structure__ herauskommt. Vanilla: 1%. 0 deaktiviert dieses Ergebnis. Jedes Ergebnis wird unabhängig gewürfelt.
csr-chance-holmium-ore=Chance in Prozent, dass beim Recyceln von einem Schrott __ITEM__holmium-ore__ herauskommt. Vanilla: 1%. 0 deaktiviert dieses Ergebnis. Jedes Ergebnis wird unabhängig gewürfelt.
